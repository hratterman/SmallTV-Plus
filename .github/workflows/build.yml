name: build

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# The release-attach step needs write access to create/update the release asset.
permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # TWO invocations, IDF-based envs first - and it must be two commands,
      # not one with reordered -e flags: pio runs environments in
      # platformio.ini definition order regardless of the -e sequence (the
      # product mtimes in run 31534141664 prove it). On a fresh checkout the
      # C2 env generates its sdkconfig and restarts the build in a nested pio
      # invocation, and that restart wipes .pio/build wholesale - which
      # silently deleted the ESP8266 images built before it and failed the
      # staging step on every CI run (locally the sdkconfig persists, so it
      # never reproduced). Building the ESP8266 envs in a second invocation
      # puts them after every wipe that can happen.
      - name: Build firmware (ESP32 targets)
        run: pio run -e smalltv_c2 -e smalltv_esp32 -e smalltv_esp32_8mb

      - name: Build firmware (ESP8266 targets)
        run: pio run -e smalltv -e smalltv_loader

      - name: List build products
        run: ls -la .pio/build/*/firmware*.bin

      # One app image per target (web-UI OTA + GitHub self-update), the merged
      # factory images for first-time USB flashing of the ESP32 boards, and the
      # minimal loader used to install onto a SmallTV-ultra.
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp .pio/build/smalltv/firmware.bin               dist/smalltv-plus-firmware.bin
          cp .pio/build/smalltv_c2/firmware.bin            dist/smalltv-plus-firmware-c2.bin
          cp .pio/build/smalltv_c2/firmware.factory.bin    dist/smalltv-plus-firmware-c2.factory.bin
          cp .pio/build/smalltv_esp32/firmware.bin         dist/smalltv-plus-firmware-esp32.bin
          cp .pio/build/smalltv_esp32/firmware.factory.bin dist/smalltv-plus-firmware-esp32.factory.bin
          cp .pio/build/smalltv_esp32_8mb/firmware.bin         dist/smalltv-plus-firmware-esp32-pro.bin
          cp .pio/build/smalltv_esp32_8mb/firmware.factory.bin dist/smalltv-plus-firmware-esp32-pro.factory.bin
          cp .pio/build/smalltv_loader/firmware.bin        dist/smalltv-plus-loader.bin

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: smalltv-plus-firmware
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
