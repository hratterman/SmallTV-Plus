name: Deploy Documentation

# Manual-only on this fork. The Astro site under docs/ is the UPSTREAM
# project's documentation (giovi321.github.io/smalltv-mod) - deploying it
# from here would publish another project's site under this repo's name,
# and with GitHub Pages unconfigured the push trigger just paints main red.
# Run it by hand if this fork ever grows its own docs site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build Starlight site
        run: npm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
